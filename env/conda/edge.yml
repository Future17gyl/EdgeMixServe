name: edge
channels:
  - nvidia
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=2.3
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1   # ★ GPU 关键包
  - cudnn
  - numpy
  - sentencepiece
  - tqdm
  - git-lfs
  - pip
  - ultralytics=8.3.163   # 2025-07-08 最新版
  - opencv-python=4.12.*
  - pynvml                # 如需显存细粒度监控
  - pip:
      - transformers==4.41
      - accelerate
